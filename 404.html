<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable, Saad Zebiri</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2f3372">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: linear-gradient(180deg, #2a2d6c 0%, #7a5592 45%, #e3866f 78%, #f8c89e 100%);
      color: #FFF6EE; font-family: "Plus Jakarta Sans", system-ui, sans-serif; line-height: 1.6;
    }
    main { width: min(560px, 100% - 40px); }
    .code { margin: 0 0 6px; font-family: "Outfit", sans-serif; font-weight: 700; font-size: clamp(5rem, 22vw, 9rem); line-height: 1; letter-spacing: -0.04em; }
    h1 { margin: 0 0 10px; font-family: "Outfit", sans-serif; font-size: clamp(1.5rem, 5vw, 2.2rem); }
    p { margin: 0 0 28px; color: rgba(255, 244, 236, 0.85); }
    a {
      display: inline-flex; align-items: center; height: 52px; padding: 0 28px; border-radius: 999px;
      background: linear-gradient(100deg, #FF8A6B, #D98BF0 55%, #A98BFF); color: #fff; font-weight: 700; text-decoration: none;
      box-shadow: 0 14px 40px -12px rgba(255, 138, 107, 0.75);
    }
    a:focus-visible { outline: 2px solid #7FF4FF; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Cette page s’est perdue dans les nuages.</h1>
    <p>Le portfolio tient maintenant sur une seule page. Les anciennes pages (activités, bilan, CV) n’existent plus.</p>
    <a href="./">Retourner sur l’île</a>
  </main>
</body>
</html>
